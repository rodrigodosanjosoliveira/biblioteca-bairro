# CI do projeto: gates (os sensores do .pipeline-claude.json) em toda PR e na
# main; validação da delivery em PR de branch task/<ID>. Arquivo do projeto:
# gerado pelo init, nunca tocado pelo sync.
name: delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    name: Gates (sensores do projeto)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL só para os testes de integração de internal/storage. Imagem
    # fixada por digest (índice multi-arch de postgres:16-alpine). Autenticação
    # trust: o banco é descartável, local ao job e sem senha no repositório.
    services:
      postgres:
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Go estável, não o do go.mod: o sensor vuln (govulncheck) reprova pela
      # biblioteca padrão do toolchain quando a linha do go.mod já não recebe
      # correção de segurança. O go.mod é a versão mínima, não a do CI.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Instalar o pipeline-claude (versão do Makefile)
        run: make tools
      - name: Sensores
        # O sensor test roda os testes de banco; OBRIGATORIO=1 reprova em vez
        # de pular se a URL faltar.
        env:
          BIBLIOTECA_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
          BIBLIOTECA_TEST_DB_OBRIGATORIO: "1"
        run: bin/pipeline-claude sensors

  validate:
    name: Validação da delivery
    # Só PR de branch task/<ID>; head_ref e base_ref entram por env, nunca
    # interpolados no run: o nome da branch vem de quem abre a PR.
    if: startsWith(github.head_ref, 'task/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Instalar o pipeline-claude (versão do Makefile)
        run: make tools
      - name: Validar a delivery
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: bin/pipeline-claude validate --base "origin/$BASE_REF" "${HEAD_REF#task/}"
